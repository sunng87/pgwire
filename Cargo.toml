[package]
name = "pgwire"
version = "0.41.0"
edition = "2024"
authors = ["Ning Sun <sunng@pm.me>"]
license = "MIT/Apache-2.0"
description = "Postgresql wire protocol implemented as a library"
keywords = ["database", "postgresql"]
categories = ["database"]
repository = "https://github.com/sunng87/pgwire"
documentation = "https://docs.rs/crate/pgwire/"
rust-version = "1.89"

[dependencies]
derive-new = "0.7"
bytes = "1.1.0"
thiserror = "2"
smol_str = "0.3.2"
## api
tokio = { version = "1.19", features = [
  "net",
  "rt",
  "io-util",
  "macros",
  "time",
], optional = true }
tokio-util = { version = "0.7.3", features = ["codec", "io"], optional = true }
tokio-rustls = { version = "0.26.2", optional = true, default-features = false, features = [
  "logging",
  "tls12",
] }
rustls-pki-types = { version = "1.10", optional = true }
futures = { version = "0.3", optional = true }
async-trait = { version = "0.1", optional = true }
pin-project = { version = "1.1", optional = true }
rand = { version = "0.10", optional = true }
md5 = { version = "0.8", optional = true }
hex = { version = "0.4", optional = true }
## scram libraries (RustCrypto)
base64 = { version = "0.23", optional = true }
stringprep = { version = "0.1.2", optional = true }
sha2 = { version = "0.10", optional = true }
hmac = { version = "0.12", optional = true }
pbkdf2 = { version = "0.12", optional = true }
x509-cert = { version = "0.3", default-features = false, features = [
  "pem",
  "std",
], optional = true }

## oauth
jsonwebtoken = { version = "11", default-features = false, features = [
  "use_pem",
  "rust_crypto",
], optional = true }
rsa = { version = "0.9", optional = true }
reqwest = { version = "0.13", features = ["json", "rustls-no-provider"], optional = true }

## types
postgres-types = { version = "0.2", features = ["array-impls"], optional = true }
chrono = { version = "0.4", features = ["std"], optional = true }
rust_decimal = { version = "1.35", features = ["db-postgres"], optional = true }
serde = { version = "1", optional = true }
serde_json = { version = "1", optional = true }
pg_interval = { version = "0.6", optional = true }
lazy-regex = { version = "3.3", default-features = false, features = ["lite"] }
ryu = "1"
postgis = { version = "0.9", optional = true }

## config
percent-encoding = { version = "2.0", optional = true }

[features]
default = ["server-api-aws-lc-rs", "pg-ext-types"]
pg-ext-types = ["pg-type-chrono", "pg-type-rust-decimal", "pg-type-serde-json"]

## Shared: TLS types (provider-less rustls) and SCRAM (pure-Rust RustCrypto)
_tls-scram = [
  "dep:tokio-rustls",
  "dep:rustls-pki-types",
  "dep:base64",
  "dep:stringprep",
  "dep:sha2",
  "dep:hmac",
  "dep:pbkdf2",
  "dep:x509-cert",
]
server-api = [
  "dep:tokio",
  "dep:tokio-util",
  "dep:futures",
  "dep:async-trait",
  "dep:rand",
  "dep:md5",
  "dep:hex",
  "dep:postgres-types",
  "dep:serde_json",
  "dep:pg_interval",
  "_tls-scram",
]
client-api = [
  "dep:percent-encoding",
  "dep:pin-project",
  "dep:tokio",
  "dep:tokio-util",
  "dep:futures",
  "dep:async-trait",
  "dep:md5",
  "dep:hex",
  "dep:rand",
  "dep:postgres-types",
  "dep:pg_interval",
  "dep:serde_json",
  "_tls-scram",
]

## Compatibility aliases: additionally select a default rustls crypto provider
## for the application. With the plain `server-api`/`client-api` features, the
## application chooses its own provider (rustls "bring your own provider").
server-api-ring = ["server-api", "tokio-rustls/ring"]
server-api-aws-lc-rs = ["server-api", "tokio-rustls/aws-lc-rs"]
client-api-ring = ["client-api", "tokio-rustls/ring"]
client-api-aws-lc-rs = ["client-api", "tokio-rustls/aws-lc-rs"]
pg-type-chrono = ["dep:chrono", "postgres-types/with-chrono-0_4"]
pg-type-rust-decimal = ["dep:rust_decimal"]
pg-type-serde-json = ["dep:serde", "dep:serde_json", "postgres-types/with-serde_json-1"]
pg-type-postgis = ["dep:postgis"]
simple-oidc-validator = [
  "dep:jsonwebtoken",
  "dep:rsa",
  "dep:reqwest",
  "dep:base64",
  "dep:serde",
]
_sqlite = []
_bundled = ["rusqlite/bundled"]

[dev-dependencies]
chrono-tz = "0.10"
tokio = { version = "1.19", features = [
  "rt-multi-thread",
  "net",
  "macros",
  "time",
] }
rustls-pki-types = { version = "1.10" }
rusqlite = { version = "0.40.0", features = ["column_decltype"] }

## for loading custom cert files
rustls-pemfile = "2.0"
## webpki-roots has mozilla's set of roots
## rustls-native-certs loads roots from current system
gluesql = { version = "0.20", default-features = false, features = [
  "gluesql_memory_storage",
] }

## oauth
jsonwebtoken = { version = "11", default-features = false, features = [
  "use_pem",
  "rust_crypto",
] }
rsa = { version = "0.9" }
reqwest = { version = "0.13", features = ["json"] }

[patch.crates-io]
pgwire = { path = "." }

[workspace]
members = [
  ".",
  "tests-integration/client-api",
  "tests-integration/rust-client",
  "tests-integration/test-server",
]

[[example]]
name = "server"
required-features = ["server-api-aws-lc-rs"]

[[example]]
name = "secure_server"
required-features = ["server-api-aws-lc-rs"]

[[example]]
name = "bench"
required-features = ["server-api-aws-lc-rs"]

[[example]]
name = "gluesql"
required-features = ["server-api-aws-lc-rs"]

[[example]]
name = "sqlite"
required-features = ["server-api-aws-lc-rs", "_sqlite"]

[[example]]
name = "copy"
required-features = ["server-api-aws-lc-rs"]

[[example]]
name = "scram"
required-features = ["server-api-aws-lc-rs"]

[[example]]
name = "oauth"
required-features = ["server-api-aws-lc-rs", "simple-oidc-validator"]

[[example]]
name = "keycloak_oauth"
required-features = ["server-api-aws-lc-rs"]

[[example]]
name = "transaction"
required-features = ["server-api-aws-lc-rs"]

[[example]]
name = "cancel"
required-features = ["server-api-aws-lc-rs"]

[[example]]
name = "cursor"
required-features = ["server-api-aws-lc-rs"]

[[example]]
name = "client"
required-features = ["client-api"]
